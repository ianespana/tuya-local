name: EV charger
products:
  - id: 281a0aqirkjcbq74
    manufacturer: Afyeev
    model: 32A Portable EV Charger
entities:
  - entity: sensor
    class: energy
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100
  - entity: sensor
    class: enum
    translation_key: status
    icon: "mdi:ev-station"
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_free
            value: available
          - dps_val: charger_insert
            value: plugged_in
          - dps_val: charger_free_fault
            value: fault_unplugged
          - dps_val: charger_charging
            value: charging
          - dps_val: charger_wait
            value: waiting
          - dps_val: charger_end
            value: charged
          - dps_val: charger_fault
            value: fault
          - dps_val: charger_pause
            value: paused
  - entity: number
    class: current
    category: config
    dps:
      - id: 4
        type: integer
        name: value
        unit: A
        range:
          min: 6
          max: 32
  - entity: sensor
    class: power
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
  - entity: sensor
    class: voltage
    category: diagnostic
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        mapping:
          - scale: 10
  - entity: sensor
    class: current
    category: diagnostic
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    name: Phase A power
    class: power
    category: diagnostic
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: kW
        class: measurement
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: sensor
    name: Total power
    class: power
    category: diagnostic
    dps:
      - id: 9
        type: integer
        optional: true
        name: sensor
        unit: kW
        class: measurement
        mapping:
          - scale: 1000
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 10
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 10
        type: bitfield
        name: fault_code
      - id: 10
        type: bitfield
        name: description
        mapping:
          - dps_val: null
            value: No fault data
          - dps_val: 0
            value: No fault
          - dps_val: 1
            value: Over-current alarm
          - dps_val: 2
            value: Over-current fault
          - dps_val: 4
            value: Over-voltage
          - dps_val: 8
            value: Under-voltage alarm
          - dps_val: 16
            value: Contactor adhesion
          - dps_val: 32
            value: Contactor fault
          - dps_val: 64
            value: Earth fault
          - dps_val: 128
            value: Meter hardware alarm
          - dps_val: 256
            value: Emergency-stop fault
          - dps_val: 512
            value: Control-pilot fault
          - dps_val: 1024
            value: Meter communication fault
          - dps_val: 2048
            value: Card-reader fault
          - dps_val: 4096
            value: Short-circuit fault
          - dps_val: 8192
            value: Adhesion fault
          - dps_val: 16384
            value: Self-test alarm
          - dps_val: 32768
            value: Leakage-current alarm
  - entity: sensor
    name: Connection
    icon: "mdi:ev-plug-type2"
    class: enum
    category: diagnostic
    dps:
      - id: 13
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: Standby
          - dps_val: controlpi_12v_pwm
            value: Communication initialising
          - dps_val: controlpi_9v
            value: Vehicle detected
          - dps_val: controlpi_9v_pwm
            value: Vehicle connected
          - dps_val: controlpi_6v
            value: Ready to charge
          - dps_val: controlpi_6v_pwm
            value: Charging
          - dps_val: controlpi_error
            value: Error
  - entity: select
    translation_key: charging_mode
    category: config
    dps:
      - id: 14
        type: string
        name: option
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_pct
            value: charge_to_percent
          - dps_val: charge_energy
            value: fixed_charge
          - dps_val: charge_schedule
            value: scheduled_charge
          - dps_val: charge_delay
            value: delayed_charge
  - entity: switch
    icon: "mdi:ev-station"
    dps:
      - id: 18
        type: boolean
        name: switch
  - entity: number
    name: Scheduled charge start hour
    category: config
    icon: "mdi:clock-start"
    dps:
      - id: 19
        type: base64
        optional: true
        name: value
        unit: h
        mask: "FF00"
        range:
          min: 0
          max: 23
  - entity: number
    name: Scheduled charge end hour
    category: config
    icon: "mdi:clock-end"
    dps:
      - id: 19
        type: base64
        optional: true
        name: value
        unit: h
        mask: "00FF"
        range:
          min: 0
          max: 23
  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 24
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Last charge
    category: diagnostic
    dps:
      - id: 25
        type: integer
        name: sensor
        unit: kWh
        class: measurement
        mapping:
          - scale: 100
  - entity: button
    name: Refresh
    icon: "mdi:sync"
    category: config
    dps:
      - id: 27
        type: string
        optional: true
        name: button
        mapping:
          - dps_val: online
            value: true
  - entity: binary_sensor
    class: connectivity
    category: diagnostic
    deprecated: button_refresh  # 2026-06-29
    dps:
      - id: 27
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: offline
            value: false
          - dps_val: online
            value: true
  - entity: number
    translation_key: timer
    class: duration
    category: config
    dps:
      - id: 28
        type: integer
        name: value
        unit: h
        range:
          min: 0
          max: 12
